name: kernel
on:
  push:
    branches: [sc8810-8056]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 源码不进本仓库：GitHub 内网 clone fxsheep 上游，秒级完成，与本地慢网络无关
      - name: Clone kyletd upstream (GitHub 内网)
        run: |
          set -e
          git clone --depth=1 -b sprdlinux3.0-kyletd \
            https://github.com/fxsheep/sprd-kernel-kyletd.git kernel
          # 本仓库的补丁若有 patches/*.patch 则依序应用
          if [ -d patches ]; then
            for p in patches/*.patch; do
              [ -e "$p" ] || continue
              echo "应用补丁: $p"
              git -C kernel apply --whitespace=nowarn "$p"
            done
          fi

      - name: Cache toolchain + ccache
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            /home/runner/.ccache
          key: arm-eabi-4.4.3-tc-v2-ccache-v1
          restore-keys: |
            arm-eabi-4.4.3-tc-v2-

      - name: Fetch toolchain (AOKP prebuilt arm-eabi-4.4.3)
        run: |
          set -e
          if [ ! -x toolchain/bin/arm-eabi-gcc ]; then
            git clone --depth=1 https://github.com/AOKP/prebuilts_gcc_linux-x86_arm_arm-eabi-4.4.3.git toolchain
          fi
          toolchain/bin/arm-eabi-gcc --version | head -1

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Configure kernel
        run: |
          set -e
          export PATH="$PWD/toolchain/bin:/usr/lib/ccache:$PATH"
          mkdir -p kernel/build
          make -C kernel O=build ARCH=arm CROSS_COMPILE="ccache arm-eabi-" kyletd-vlx_defconfig

      - name: Build kernel
        run: |
          set -e
          export PATH="$PWD/toolchain/bin:/usr/lib/ccache:$PATH"
          make -C kernel O=build -j$(nproc) zImage
          make -C kernel O=build -j$(nproc) modules || true

      - name: Verify artifacts
        run: |
          set -e
          ls -l kernel/build/arch/arm/boot/zImage
          file kernel/build/arch/arm/boot/zImage
          strings kernel/build/arch/arm/boot/zImage | grep -m1 'Linux version' || true

      - uses: actions/upload-artifact@v4
        with:
          name: zImage-${{ github.sha }}
          path: |
            kernel/build/arch/arm/boot/zImage
            kernel/build/System.map
            kernel/build/.config
          if-no-files-found: error
          retention-days: 30
