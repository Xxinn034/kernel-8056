name: kernel
on:
  push:
    branches: [sc8810-8056]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache toolchain + ccache
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            /home/runner/.ccache
          key: arm-eabi-4.4.3-tc-v1-ccache-v1
          restore-keys: |
            arm-eabi-4.4.3-tc-v1-

      - name: Fetch toolchain (AOKP prebuilt arm-eabi-4.4.3)
        run: |
          set -e
          if [ ! -x toolchain/bin/arm-eabi-gcc ]; then
            git clone --depth=1 https://github.com/AOKP/prebuilts_gcc_linux-x86_arm_arm-eabi-4.4.3.git toolchain
          fi
          toolchain/bin/arm-eabi-gcc --version | head -1

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache u-boot-tools

      - name: Configure kernel
        run: |
          set -e
          export PATH="$PWD/toolchain/bin:/usr/lib/ccache:$PATH"
          export ARCH=arm CROSS_COMPILE="ccache arm-eabi-"
          make O=build kyletd-vlx_defconfig

      - name: Build kernel
        run: |
          set -e
          export PATH="$PWD/toolchain/bin:/usr/lib/ccache:$PATH"
          export ARCH=arm CROSS_COMPILE="ccache arm-eabi-"
          make O=build -j$(nproc) zImage
          make O=build -j$(nproc) modules || true

      - name: Verify artifacts
        run: |
          set -e
          ls -l build/arch/arm/boot/zImage
          file build/arch/arm/boot/zImage
          gzip -t < build/arch/arm/boot/zImage > /dev/null 2>&1 || echo "zImage 非纯 gzip（正常，zImage 自解压头）"
          strings build/arch/arm/boot/zImage | grep -m1 'Linux version' || true

      - uses: actions/upload-artifact@v4
        with:
          name: zImage-${{ github.sha }}
          path: |
            build/arch/arm/boot/zImage
            build/System.map
            build/.config
          if-no-files-found: error
          retention-days: 30
